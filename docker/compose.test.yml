# Isolated integration stack. Always use -p judge-packaging-smoke with this file.
# No host ports and no access to the application's PostgreSQL/Redis/SQS volumes.
services:
  postgres:
    container_name: judge-packaging-smoke-postgres
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      JUDGE_INTEGRATION_TEST: "true"
      RESULT_WORKER_ENABLED: ${TEST_RESULT_WORKER_ENABLED:-true}
      SQS_ENDPOINT_URL: http://sqs:9324
    depends_on:
      sqs:
        condition: service_started
  sandbox-worker:
    environment:
      SQS_ENDPOINT_URL: http://sqs:9324
  frontend:
    ports: !reset []
  # Local queue emulator exists only in the disposable integration stack.
  sqs:
    image: judge-sqs:local
    build:
      context: ./docker
      dockerfile: Dockerfile.sqs
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro
      - sqs_data:/data

volumes:
  postgres_data:
    name: judge-packaging-smoke_postgres_data
  redis_data:
    name: judge-packaging-smoke_redis_data
  sqs_data:
    name: judge-packaging-smoke_sqs_data
