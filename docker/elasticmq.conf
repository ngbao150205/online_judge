include classpath("application.conf")
node-address {
  protocol = http
  host = "sqs"
  port = 9324
  context-path = ""
}
aws {
  region = "ap-southeast-1"
  accountId = "000000000000"
}
messages-storage.enabled = true
queues {
  judge-jobs-dlq {}
  judge-results-dlq {}
  judge-jobs {
    deadLettersQueue { name = "judge-jobs-dlq", maxReceiveCount = 3 }
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
  }
  judge-results {
    deadLettersQueue { name = "judge-results-dlq", maxReceiveCount = 3 }
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
  }
}
